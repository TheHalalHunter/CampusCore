name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campuscore_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

      - name: Run tests
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: campuscore_test
          JWT_SECRET: ci-test-secret-key
          JWT_REFRESH_SECRET: ci-refresh-secret-key
          FIREBASE_PROJECT_ID: test-project
          FIREBASE_PRIVATE_KEY: '{"type":"service_account"}'
          FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
          OPENAI_API_KEY: test-key
          OPENAI_BASE_URL: https://agentrouter.org/v1
        run: npm test -- --passWithNoTests
        working-directory: backend

  flutter-mobile:
    name: Flutter Mobile App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get
        working-directory: mobile_app

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        working-directory: mobile_app

      - name: Run tests
        run: flutter test --no-pub
        working-directory: mobile_app

  flutter-admin:
    name: Flutter Admin Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get
        working-directory: admin_dashboard

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        working-directory: admin_dashboard

      - name: Run tests
        run: flutter test --no-pub
        working-directory: admin_dashboard

  flutter-web:
    name: Flutter Web App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get
        working-directory: web_app

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        working-directory: web_app

      - name: Run tests
        run: flutter test --no-pub
        working-directory: web_app

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Run npm audit
        run: npm ci && npm audit --audit-level=high
        working-directory: backend

  all-checks:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [backend-build, flutter-mobile, flutter-admin, flutter-web]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Backend: ${{ needs.backend-build.result }}"
          echo "Flutter Mobile: ${{ needs.flutter-mobile.result }}"
          echo "Flutter Admin: ${{ needs.flutter-admin.result }}"
          echo "Flutter Web: ${{ needs.flutter-web.result }}"
          if [ "${{ needs.backend-build.result }}" = "failure" ]; then
            echo "Backend build failed"
            exit 1
          fi
          if [ "${{ needs.flutter-mobile.result }}" = "failure" ]; then
            echo "Flutter mobile build failed"
            exit 1
          fi
          if [ "${{ needs.flutter-admin.result }}" = "failure" ]; then
            echo "Flutter admin build failed"
            exit 1
          fi
          if [ "${{ needs.flutter-web.result }}" = "failure" ]; then
            echo "Flutter web build failed"
            exit 1
          fi
          echo "All critical checks passed"
