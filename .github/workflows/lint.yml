name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Lint backend
        run: npm run lint
        working-directory: backend
        continue-on-error: true

  lint-flutter:
    name: Lint Flutter Apps
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Analyze mobile app
        run: flutter pub get && flutter analyze --no-fatal-infos
        working-directory: mobile_app
        continue-on-error: true

      - name: Analyze admin dashboard
        run: flutter pub get && flutter analyze --no-fatal-infos
        working-directory: admin_dashboard
        continue-on-error: true
