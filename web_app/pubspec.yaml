name: campuscore_web
description: CampusCore - Learn. Connect. Achieve. Web App for students.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # HTTP client
  dio: ^5.4.1

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0
  google_sign_in: ^6.2.0

  # Local storage
  shared_preferences: ^2.2.3

  # Image & caching
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # UI utilities
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  lottie: ^3.1.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.67.0

  # Freezed / JSON
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.11

flutter:
  uses-material-design: true
