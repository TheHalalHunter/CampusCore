name: campuscore_web
description: CampusCore - Learn. Connect. Achieve. Web App for students.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP client
  dio: ^5.4.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  firebase_storage: ^12.4.4
  google_sign_in: ^6.2.0

  # Local storage
  shared_preferences: ^2.2.3

  # URL launcher (for resource downloads)
  url_launcher: ^6.2.6

  # File picker (Wasm-compatible replacement for dart:html file input)
  file_picker: ^8.1.2

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
