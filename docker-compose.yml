version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: campuscore-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campuscore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campuscore-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: campuscore
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-placeholder}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-placeholder}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-placeholder}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-placeholder}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-placeholder}
      STELLAR_NETWORK: testnet
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run start:dev
    networks:
      - campuscore

volumes:
  postgres_data:

networks:
  campuscore:
    driver: bridge
